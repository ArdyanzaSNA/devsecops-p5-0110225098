
name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall -q app tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  sast-scan:
    name: SAST and Quality Gate
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Run Bandit scan
        run: |
          bandit -r app -f json -o bandit-report.json || true

      - name: Enforce Quality Gate
        run: |
          python -c "import json,sys; r=json.load(open('bandit-report.json')); f=[x for x in r.get('results',[]) if x.get('issue_severity') == 'HIGH']; print('High severity findings:',len(f)); [print(x.get('filename'),x.get('line_number'),x.get('issue_text')) for x in f]; sys.exit(1 if f else 0)"

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          if-no-files-found: ignore
